[package]
name = "apogee"
version = "1.0.0"
license = "MIT"
edition = "2021"
description = "A desktop shell for Sway: bar, dock, Spotlight, popups, notifications and a Settings app"

# malý klient bez GTK (spouští se při každém kliknutí a drží moduly panelu)
# a démon s GTK, který dělá všechno ostatní
[[bin]]
name = "apogee"
path = "src/client.rs"

[[bin]]
name = "apogee-daemon"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
gtk4-layer-shell = "0.8"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swayipc = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
